<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title th:text="${asunto}">SIGER</title></head>
<body style="margin:0;padding:24px;background:#f9f9ff;">
<!-- Aviso al buzón de soporte (siger.soporte.correo). «Responder» contesta directo a quien reportó el problema. -->
<div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #c5c5d3;border-radius:12px;">
  <div th:replace="~{correo/fragmentos :: encabezado}"></div>
  <div style="padding:24px;font-family:Arial,sans-serif;font-size:15px;line-height:22px;color:#151c27;">
    <p style="margin-top:0;">Nueva solicitud de soporte <strong th:text="|#${id}|">#1</strong>.</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <tr><td style="padding:6px 8px;color:#757682;width:120px;">Tipo</td><td style="padding:6px 8px;" th:text="${tipo}">Incidente</td></tr>
      <tr style="background:#f4f6fc;"><td style="padding:6px 8px;color:#757682;">Contacto</td><td style="padding:6px 8px;" th:text="${correoContacto}">correo</td></tr>
      <tr><td style="padding:6px 8px;color:#757682;">Usuario</td><td style="padding:6px 8px;" th:text="${usuario}">Sin cuenta</td></tr>
      <tr style="background:#f4f6fc;"><td style="padding:6px 8px;color:#757682;">Fecha</td><td style="padding:6px 8px;" th:text="${fecha}">01/01/2026 10:00</td></tr>
    </table>
    <p style="margin-bottom:6px;"><strong>Descripción</strong></p>
    <p style="margin-top:0;padding:12px;background:#f4f6fc;border-radius:8px;white-space:pre-wrap;" th:text="${descripcion}">Texto</p>
    <p>Responde este correo para contestar a la persona. Para cambiar el estado, entra a la administración de soporte.</p>
    <p style="text-align:center;margin:28px 0;">
      <a th:href="@{|${frontendUrl}/admin/soporte|}" style="background:#00236f;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:bold;display:inline-block;">Abrir soporte en SIGER</a>
    </p>
  </div>
</div>
</body>
</html>
